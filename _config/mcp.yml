---
Name: cmsmcp-config
---
SilverStripe\Core\Injector\Injector:
  FLXLabs\CmsMcp\MCP\ToolRegistry:
    properties:
      Tools:
        - '%$FLXLabs\CmsMcp\Tools\ListClassesTool'
        - '%$FLXLabs\CmsMcp\Tools\SearchRecordsTool'
        - '%$FLXLabs\CmsMcp\Tools\GetRecordTool'
        - '%$FLXLabs\CmsMcp\Tools\ListFieldsTool'
        - '%$FLXLabs\CmsMcp\Tools\UpdateRecordTool'
        - '%$FLXLabs\CmsMcp\Tools\UploadFileTool'
        - '%$FLXLabs\CmsMcp\Tools\PublishRecordTool'
        - '%$FLXLabs\CmsMcp\Tools\UnpublishRecordTool'
        - '%$FLXLabs\CmsMcp\Tools\VersionHistoryTool'
        - '%$FLXLabs\CmsMcp\Tools\RollbackRecordTool'
        - '%$FLXLabs\CmsMcp\Tools\RecordStatusTool'
        - '%$FLXLabs\CmsMcp\Tools\CreateRecordTool'
        - '%$FLXLabs\CmsMcp\Tools\RemoveManyManyTool'
        - '%$FLXLabs\CmsMcp\Tools\AddManyManyFilesTool'
        - '%$FLXLabs\CmsMcp\Tools\UploadFileFromUrlTool'
        - '%$FLXLabs\CmsMcp\Tools\MoveFileTool'
        - '%$FLXLabs\CmsMcp\Tools\RenameFileTool'
        - '%$FLXLabs\CmsMcp\Tools\ListRecordIdsTool'
        - '%$FLXLabs\CmsMcp\Tools\SearchByRelationTool'
        - '%$FLXLabs\CmsMcp\Tools\CreateTranslationTool'

FLXLabs\CmsMcp\ClassExposure:
  # DataObject classes (and their subclasses) that may be exposed via MCP tools.
  # Add your own project classes here, or apply the FLXLabs\CmsMcp\Extensions\MCPExposableExtension
  # extension to a class instead of listing it here.
  allowed_classes:
    - SilverStripe\CMS\Model\SiteTree
    - SilverStripe\Assets\File
  # Classes (and their subclasses) that must never be exposed, regardless of allowed_classes
  # or the MCPExposableExtension marker. Deny always wins.
  denied_classes:
    - SilverStripe\Security\Member
    - SilverStripe\Security\Group
    - SilverStripe\Security\Permission
    - SilverStripe\Security\PermissionRole
    - SilverStripe\Security\PermissionRoleCode
    - SilverStripe\Security\RememberLoginHash
    - SilverStripe\Security\LoginAttempt
    - SilverStripe\Security\SecurityToken
    - FLXLabs\CmsMcp\Model\MCPAccessToken
  # Field names hidden from list_fields/get_record/update_record on every exposed class
  global_denied_fields:
    - ID
    - ClassName
    - Version
    - RecordClassName
